{{- /* The Confirm button on /confirm/. It's a shortcode, so it works even when
       the site doesn't allow raw HTML in Markdown. */ -}}
<div class="subscribe-confirm">
    <p id="confirm-text">One last step. Click the button below to start getting new posts from {{ site.Title }} by email.</p>
    <form id="confirm-form" method="post">
        <button type="submit">Confirm subscription</button>
    </form>
</div>
<script>
    (function () {
        var form = document.getElementById('confirm-form');
        var text = document.getElementById('confirm-text');

        var params = new URLSearchParams(window.location.search);
        var expires = Number(params.get('expires'));

        // The link from the email carries the address, expiry and signature.
        // Send them along to /api/confirm when the button is clicked.
        if (!params.get('email') || !expires || !params.get('signature')) {
            text.textContent = 'This page only works with the link from your confirmation email.';
            form.hidden = true;
        } else if (expires < Date.now()) {
            // Say so straight away, instead of after the click. The Function
            // still checks the expiry and signature itself, so this is only a shortcut.
            text.textContent = 'This link has expired. To subscribe, sign up again at the end of any post.';
            form.hidden = true;
        } else {
            form.action = '/api/confirm' + window.location.search;
        }
    })();
</script>
